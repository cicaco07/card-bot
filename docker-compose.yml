services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cardbot
      POSTGRES_USER: cardbot
      POSTGRES_PASSWORD: cardbot
    ports:
      - "5432:5432"
    volumes:
      - cardbot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardbot -d cardbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cardbot-postgres:
